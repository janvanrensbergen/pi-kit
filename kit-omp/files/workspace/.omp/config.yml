skills:
  customDirectories:
    - ./skills
  enableSkillCommands: true

modelProviderOrder:
  - github-copilot
  - openrouter

defaultProvider: github-copilot
defaultModel: github-copilot/gpt-5.5

modelRoles:
  default: github-copilot/gpt-5.5:low
  smol: github-copilot/mai-code-1.1-flash:low
  task: github-copilot/gpt-5.6-luna:low
  advisor: github-copilot/claude-sonnet-5:low
  slow: github-copilot/claude-opus-4.8:high

retry:
  enabled: true
  maxRetries: 2
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - github-copilot/gpt-5.5:low
      - openrouter/z-ai/glm-5.3-flash:low
      - openrouter/openai/gpt-5.6-luna-pro:low

    smol:
      - github-copilot/mai-code-1.1-flash:low
      - openrouter/qwen/qwen3.7-flash:low
      - openrouter/deepseek/deepseek-v4-flash-0731:low
      - openrouter/nex-agi/nex-n2.5-mini:free

    task:
      - github-copilot/gpt-5.6-luna:low
      - openrouter/openai/gpt-5.6-luna-pro:low
      - openrouter/z-ai/glm-5.3:low

    advisor:
      - github-copilot/claude-sonnet-5:low
      - openrouter/x-ai/grok-4.6:low
      - openrouter/anthropic/claude-sonnet-5:low

    slow:
      - github-copilot/claude-opus-4.8:high
      - openrouter/anthropic/claude-opus-4.8:high
      - openrouter/z-ai/glm-5.3:high

defaultThinkingLevel: low
thinkingBudgets:
  low: 2048
  medium: 4096
  high: 8192

theme:
  dark: dark
  light: light

mcp:
  enableProjectConfig: true

memory:
  backend: local

task:
  agentModelOverrides:
    scout:
      - github-copilot/mai-code-1.1-flash:low
      - openrouter/qwen/qwen3.7-flash:low
      - openrouter/deepseek/deepseek-v4-flash-0731:low

    reviewer:
      - github-copilot/claude-sonnet-5:low
      - openrouter/z-ai/glm-5.3:low
      - openrouter/anthropic/claude-sonnet-5:low

    task:
      - github-copilot/gpt-5.6-luna:low
      - openrouter/openai/gpt-5.6-luna-pro:low
      - openrouter/z-ai/glm-5.3:low

    security-reviewer:
      - github-copilot/claude-sonnet-5:low
      - openrouter/anthropic/claude-sonnet-5:low
      - openrouter/z-ai/glm-5.3:low
