onboarding = false

[terminal]
default_shell = "/bin/bash"

# Mirror every top-level entry of the parent folder's .omp into the current
# workspace's ./.omp. Once any ./.omp exists, OMP stops walking further up
# the tree, so a partial ./.omp would silently lose entries (skills/,
# SYSTEM.md, RULES.md, AGENTS.md, ...) it would otherwise inherit from the
# ancestor .omp -- mirror everything instead of picking a subset. See
# bash/omp-link-parent. prefix+alt+o fails if ./.omp already exists;
# prefix+alt+shift+o reruns it with --force (backs up colliding real
# files/dirs as <name>.bak-<timestamp>, replaces stale symlinks outright).
[[keys.command]]
key = "prefix+alt+o"
type = "popup"
command = "bash -lc 'omp-link-parent; echo; echo \"[omp-link-parent] press any key to close\"; read -n 1 -s'"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+alt+shift+o"
type = "popup"
command = "bash -lc 'omp-link-parent --force; echo; echo \"[omp-link-parent --force] press any key to close\"; read -n 1 -s'"
width = "80%"
height = "60%"
