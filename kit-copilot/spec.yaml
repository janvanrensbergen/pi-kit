schemaVersion: "2"
kind: mixin
name: copilot
displayName: GitHub Copilot
description: "GitHub Copilot access for the OMP sandbox: egress and proxy-managed COPILOT_GITHUB_TOKEN"

permissions:
  network:
    allow:
      - api.githubcopilot.com
      - api.individual.githubcopilot.com
      - api.business.githubcopilot.com
      - api.enterprise.githubcopilot.com
      - copilot.github.com
      - copilot-proxy.githubusercontent.com

credentials:
  - service: copilot
    apiKey:
      # Copilot CLI prioritizes COPILOT_GITHUB_TOKEN over GH_TOKEN/GITHUB_TOKEN,
      # so this can hold a separate, fine-grained PAT (copilot request scope)
      # without affecting the broader github secret used for gh/git access
      # (the `github` credential stays in the base omp kit).
      # https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-cli
      # Deliberately does NOT inject into api.github.com: the base kit's
      # `github` credential owns that domain; avoids two services racing it.
      name: COPILOT_GITHUB_TOKEN
      proxyManaged: true
      inject:
        # https://github.blog/changelog/2026-02-13-network-configuration-changes-for-copilot-coding-agent/
        - domain: api.business.githubcopilot.com # Copilot Business
          header: Authorization
          format: Bearer %s
        - domain: api.enterprise.githubcopilot.com # Copilot Enterprise
          header: Authorization
          format: Bearer %s
        - domain: api.githubcopilot.com
          header: Authorization
          format: Bearer %s
        - domain: api.individual.githubcopilot.com # Copilot Pro and Pro+
          header: Authorization
          format: Bearer %s
        - domain: copilot.github.com
          header: Authorization
          format: Bearer %s
