name: publish pi-kit image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    # The image now bakes the whole kit, so any content that lands in the
    # image rebuilds it: Dockerfile, .dockerignore, the portable settings,
    # package manifest, and the shipped resource categories.
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/publish.yml
      - settings.json
      - package.json
      - skills/**
      - themes/**
      - prompts/**
      - extensions/**
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/janvanrensbergen/pi-kit
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=v{{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # PI_VERSION is pinned in the Dockerfile (ARG PI_VERSION=0.84.3).
          # To publish a different version bump the ARG default or set build-args.
          build-args: |
            PI_VERSION=0.84.3

      # Make the GHCR package public so the sandbox can pull it without a token.
      # build-push-action publishes packages as private by default; set
      # visibility once here (re-runs are idempotent). Requires a token with
      # `packages: write` on the repo — the default GITHUB_TOKEN satisfies this.
      - name: Make package public
        shell: bash
        run: |
          curl -fsS \
            -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/pi-kit" \
            -d '{"visibility":"public"}'