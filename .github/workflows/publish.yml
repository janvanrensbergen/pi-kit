name: publish pi-kit image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    # The image now bakes the whole kit, so any content that lands in the
    # image rebuilds it: Dockerfile, .dockerignore, the portable settings,
    # package manifest, and the shipped resource categories.
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/publish.yml
      - settings.json
      - package.json
      - skills/**
      - themes/**
      - prompts/**
      - extensions/**
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU registers binfmt handlers so Buildx can build non-amd64
      # platforms (linux/arm64) on the amd64 runner via emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/janvanrensbergen/pi-kit
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=v{{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Multi-arch: the base image (docker/sandbox-templates:shell-docker)
          # ships linux/amd64 and linux/arm64, and pi-kit is architecture-
          # neutral (JS + npm), so one buildx push emits a merged index.
          platforms: linux/amd64,linux/arm64
          # PI_VERSION is pinned in the Dockerfile (ARG PI_VERSION=0.84.3).
          # To publish a different version bump the ARG default or set build-args.
          build-args: |
            PI_VERSION=0.84.3
