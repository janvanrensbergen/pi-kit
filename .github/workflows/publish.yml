name: publish pi-kit and sandbox image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    # Any content that lands in the image or kit rebuilds/re-publishes:
    # Dockerfile, .dockerignore, portable settings, package manifest,
    # kit spec, and the shipped resource categories.
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/publish.yml
      - settings.json
      - package.json
      - skills/**
      - themes/**
      - prompts/**
      - extensions/**
      - kit/**
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU registers binfmt handlers so Buildx can build non-amd64
      # platforms (linux/arm64) on the amd64 runner via emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR (Docker)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (ORAS)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract metadata (tags, labels) for Docker sandbox image
        id: meta-image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/janvanrensbergen/pi-sandbox
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=v{{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-image.outputs.tags }}
          labels: ${{ steps.meta-image.outputs.labels }}
          # Multi-arch: the base image (docker/sandbox-templates:shell)
          # ships linux/amd64 and linux/arm64, and pi-sandbox is architecture-
          # neutral (JS + npm), so one buildx push emits a merged index.
          platforms: linux/amd64,linux/arm64
          # PI_VERSION is pinned in the Dockerfile (ARG PI_VERSION=0.84.3).
          # To publish a different version bump the ARG default or set build-args.
          build-args: |
            PI_VERSION=0.84.3

      - name: Extract metadata (tags, labels) for Kit
        id: meta-kit
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/janvanrensbergen/pi-kit
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=v{{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Package kit
        run: |
          cd kit
          zip -r ../pi-kit.zip .
          cd ..

      - name: Publish kit artifact to GHCR
        env:
          TAGS: ${{ steps.meta-kit.outputs.tags }}
        run: |
          for tag in $TAGS; do
            oras push "$tag" pi-kit.zip
          done
