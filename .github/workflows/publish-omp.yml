name: publish omp kit and sandbox image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - Dockerfile.omp
      - omp/**
      - .github/workflows/publish-omp.yml
      - kit-omp/**
      - skills/**
      - themes/**
      - prompts/**
      - extensions/**
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-omp:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/janvanrensbergen/omp-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (Docker)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full OMP image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.omp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            BUILD_KOTLIN_LSP=1
            KOTLIN_LSP_VERSION=0.0.12

      - name: Extract metadata (tags, labels) for OMP sandbox image
        id: meta-omp-image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/janvanrensbergen/omp-sandbox
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=v{{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push OMP sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.omp
          push: true
          tags: ${{ steps.meta-omp-image.outputs.tags }}
          labels: ${{ steps.meta-omp-image.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            OMP_VERSION=18.1.14

      - name: Install sbx
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/docker-sbx.tar.gz"
          curl -fsSL https://github.com/docker/sbx-releases/releases/download/v0.39.0/DockerSandboxes-linux-amd64.tar.gz -o "$archive"
          echo "2ec45bc7938c20c2f406fe8cc72294ad5a954bdc047601484b89bf1a108311d4  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" docker-sbx/sbx
          sudo install -m 0755 "$RUNNER_TEMP/docker-sbx/sbx" /usr/local/bin/sbx
          sbx version

      - name: Publish OMP kit to GHCR
        run: sbx kit push ./kit-omp ghcr.io/janvanrensbergen/omp-kit:latest
