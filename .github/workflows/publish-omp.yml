name: publish omp kit and sandbox image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - Dockerfile
      - omp/**
      - .github/workflows/publish-omp.yml
      - kit-omp/**
      - kit-kotlin-lsp/**
      - skills/**
      - themes/**
      - prompts/**
      - extensions/**
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      kit_omp: ${{ steps.filter.outputs.kit_omp }}
      kit_kotlin_lsp: ${{ steps.filter.outputs.kit_kotlin_lsp }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - Dockerfile
              - omp/**
              - skills/**
              - themes/**
              - prompts/**
              - extensions/**
              - .github/workflows/publish-omp.yml
            kit_omp:
              - kit-omp/**
            kit_kotlin_lsp:
              - kit-kotlin-lsp/**

  publish-omp:
    needs: changes
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/janvanrensbergen/omp-sandbox
      # On a push to main, only rebuild/republish what actually changed. A
      # tag push or GitHub release always does everything, so a cut release
      # is fully reproducible regardless of which paths last touched main.
      FORCE_ALL: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: env.FORCE_ALL == 'true' || needs.changes.outputs.image == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: env.FORCE_ALL == 'true' || needs.changes.outputs.image == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (Docker)
        if: env.FORCE_ALL == 'true' || needs.changes.outputs.image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OMP sandbox image
        if: env.FORCE_ALL == 'true' || needs.changes.outputs.image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            OMP_VERSION=18.1.15

      - name: Install sbx
        if: env.FORCE_ALL == 'true' || needs.changes.outputs.kit_omp == 'true' || needs.changes.outputs.kit_kotlin_lsp == 'true'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/docker-sbx.tar.gz"
          curl -fsSL https://github.com/docker/sbx-releases/releases/download/v0.39.0/DockerSandboxes-linux-amd64.tar.gz -o "$archive"
          echo "2ec45bc7938c20c2f406fe8cc72294ad5a954bdc047601484b89bf1a108311d4  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" docker-sbx/sbx
          sudo install -m 0755 "$RUNNER_TEMP/docker-sbx/sbx" /usr/local/bin/sbx
          sbx version

      - name: Publish kit-omp to GHCR
        if: env.FORCE_ALL == 'true' || needs.changes.outputs.kit_omp == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if sbx kit push ./kit-omp ghcr.io/janvanrensbergen/omp-kit:latest; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "GHCR manifest not ready; retrying in 10 seconds (attempt $((attempt + 1))/6)"
              sleep 10
            fi
          done
          exit 1

      - name: Publish kit-kotlin-lsp to GHCR
        if: env.FORCE_ALL == 'true' || needs.changes.outputs.kit_kotlin_lsp == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if sbx kit push ./kit-kotlin-lsp ghcr.io/janvanrensbergen/kotlin-lsp-kit:latest; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "GHCR manifest not ready; retrying in 10 seconds (attempt $((attempt + 1))/6)"
              sleep 10
            fi
          done
          exit 1

