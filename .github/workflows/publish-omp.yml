name: publish omp kit and sandbox image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - Dockerfile.omp
      - omp/**
      - .github/workflows/publish-omp.yml
      - kit-omp/**
      - kit-kotlin-lsp/**
      - skills/**
      - themes/**
      - prompts/**
      - extensions/**
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-omp:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/janvanrensbergen/omp-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (Docker)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OMP sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.omp
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            OMP_VERSION=18.1.15

      - name: Install sbx
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/docker-sbx.tar.gz"
          curl -fsSL https://github.com/docker/sbx-releases/releases/download/v0.39.0/DockerSandboxes-linux-amd64.tar.gz -o "$archive"
          echo "2ec45bc7938c20c2f406fe8cc72294ad5a954bdc047601484b89bf1a108311d4  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" docker-sbx/sbx
          sudo install -m 0755 "$RUNNER_TEMP/docker-sbx/sbx" /usr/local/bin/sbx
          sbx version

      - name: Publish OMP kits to GHCR
        run: |
          set -euo pipefail
          push_kit() {
            for attempt in 1 2 3 4 5 6; do
              if sbx kit push "$1" "$2"; then
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then
                echo "GHCR manifest not ready; retrying in 10 seconds (attempt $((attempt + 1))/6)"
                sleep 10
              fi
            done
            return 1
          }
          push_kit ./kit-omp ghcr.io/janvanrensbergen/omp-kit:latest
          push_kit ./kit-kotlin-lsp ghcr.io/janvanrensbergen/kotlin-lsp-kit:latest
