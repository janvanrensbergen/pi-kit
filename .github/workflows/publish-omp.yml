name: publish omp kit and sandbox image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - Dockerfile.omp
      - omp/**
      - .github/workflows/publish-omp.yml
      - kit-omp/**
      - skills/**
      - themes/**
      - prompts/**
      - extensions/**
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-omp:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/janvanrensbergen/omp-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (Docker)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OMP sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.omp
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            OMP_VERSION=18.1.15
            BUILD_KOTLIN_LSP=1
            KOTLIN_LSP_VERSION=${{ env.KOTLIN_LSP_VERSION }}
            KOTLIN_LSP_TARGET_PLATFORM=${{ env.KOTLIN_LSP_TARGET_PLATFORM }}

      - name: Install sbx
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/docker-sbx.tar.gz"
          curl -fsSL https://github.com/docker/sbx-releases/releases/download/v0.39.0/DockerSandboxes-linux-amd64.tar.gz -o "$archive"
          echo "2ec45bc7938c20c2f406fe8cc72294ad5a954bdc047601484b89bf1a108311d4  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" docker-sbx/sbx
          sudo install -m 0755 "$RUNNER_TEMP/docker-sbx/sbx" /usr/local/bin/sbx
          sbx version

      - name: Publish OMP kit to GHCR
        run: sbx kit push ./kit-omp ghcr.io/janvanrensbergen/omp-kit:latest
