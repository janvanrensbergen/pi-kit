# OMP configuration for the experimental pi-kit sibling.
# Keep resource paths explicit so the image does not depend on the checkout path.
# OMP 18.x has native task subagents, plan mode, MCP, web search/fetch, and
# memory backends. Extension packages are managed with `omp plugin ...`, not a
# top-level Pi-style `packages:` list.
skills:
  - /home/agent/.omp/agent/skills

enableSkillCommands: true

prompts:
  - /home/agent/.omp/agent/prompts

themes:
  - /home/agent/.omp/agent/themes

# Pre-answer the first-run setup wizard (setupVersion = CURRENT_SETUP_VERSION in
# @oh-my-pi/pi-tui/setup/setup-version.ts). Login and default model are skipped.
setupVersion: 2
symbolPreset: unicode
composer:
  shape: pi
# "Match terminal": Titanium in dark terminals, Light in light terminals.
theme:
  dark: titanium
  light: light

defaultProvider: github-copilot
defaultModel: github-copilot/gpt-5.5
defaultThinkingLevel: low
showCacheMissNotices: true

# Route native OMP task subagents through model roles. The bundled generic
# `task` agent uses @task, and the low-reasoning `sonic` agent uses @smol.
modelRoles:
  task: github-copilot/gpt-5.5
  smol: github-copilot/mai-code-1.1-flash

thinkingBudget:
  low: 2048
  medium: 4096
  high: 8192

terminal:
  showTerminalProgress: true

compaction:
  enabled: true

# OMP-native subagents are configured under task.*.
task:
  batch: true
  maxConcurrency: 32
  maxRecursionDepth: 2
  maxRuntimeMs: 0
  maxEffort: high
  agentModelOverrides:
    task: github-copilot/gpt-5.5

# Enable OMP's local memory summary backend. Other native choices include
# `mnemopi`, `hindsight`, and `sharpshooter` when their backing services or
# dependencies are desired.
memory:
  backend: local

# Autolearn exposes `learn` (lessons into the local memory backend) and
# `manage_skill` (managed skills under ~/.omp/agent/managed-skills).
autolearn:
  enabled: true

extensions:
  - /home/agent/.omp/agent/extensions
